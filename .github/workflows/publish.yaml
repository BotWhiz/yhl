name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.126.3'

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true  # 改为true确保无残留进程

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force override upload-artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dummy-artifact
          path: /tmp/empty
          retention-days: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true

      - uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache_runner/
            ~/.hugo_cache/
          key: ${{ runner.os }}-hugo-${{ env.WC_HUGO_VERSION }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Check Implicit Dependencies
        run: |
          mkdir -p /tmp/empty
          grep -r "upload-artifact@v3" ./themes/ || true
          hugo mod graph

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          mkdir -p public
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --cacheDir /tmp/hugo_cache_runner

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3  # 升级至最新稳定版
        with:
          path: ./public

  deploy:
    if: github.repository_owner != 'HugoBlox'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
